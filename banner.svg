<svg width="1200" height="300" viewBox="0 0 1200 300" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bg" cx="50%" cy="0%" r="100%">
      <stop offset="0%" stop-color="#B968FF">
        <animate attributeName="stop-color" values="#B968FF;#FF6EC7;#B968FF" dur="6s" repeatCount="indefinite"/>
      </stop>
      <stop offset="55%" stop-color="#7C1FA0"/>
      <stop offset="100%" stop-color="#0D1117"/>
    </radialGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="6" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="300" fill="url(#bg)"/>

  <!-- Left decorative stripes -->
  <g stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3">
    <line x1="150" y1="260" x2="190" y2="220"/>
    <line x1="180" y1="260" x2="220" y2="220"/>
    <line x1="210" y1="260" x2="250" y2="220"/>
  </g>
  <!-- Right decorative stripes -->
  <g stroke="#FFFFFF" stroke-opacity="0.5" stroke-width="3">
    <line x1="950" y1="260" x2="990" y2="220"/>
    <line x1="980" y1="260" x2="1020" y2="220"/>
    <line x1="1010" y1="260" x2="1050" y2="220"/>
  </g>

  <!-- Pulsing glow ring behind avatar -->
  <circle cx="600" cy="95" r="46" fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="2" filter="url(#glow)">
    <animate attributeName="r" values="42;52;42" dur="2.5s" repeatCount="indefinite"/>
    <animate attributeName="stroke-opacity" values="0.7;0.1;0.7" dur="2.5s" repeatCount="indefinite"/>
  </circle>

  <!-- Center avatar circle -->
  <circle cx="600" cy="95" r="42" fill="#0D1117"/>
  <text x="600" y="107" font-family="Verdana, sans-serif" font-size="30" font-weight="bold" fill="#FFFFFF" text-anchor="middle">ES</text>

  <!-- Main title (fade-in) -->
  <text x="600" y="200" font-family="Verdana, sans-serif" font-size="52" font-weight="bold" fill="#FFFFFF" text-anchor="middle" letter-spacing="2" opacity="0">
    ESRAA SHALABY
    <animate attributeName="opacity" from="0" to="1" dur="1.5s" begin="0.3s" fill="freeze"/>
  </text>

  <!-- Subtitle (fade-in, slightly delayed) -->
  <text x="600" y="235" font-family="Verdana, sans-serif" font-size="16" font-weight="bold" fill="#F3E8FF" text-anchor="middle" letter-spacing="3" opacity="0">
    FULL STACK DEVELOPER
    <animate attributeName="opacity" from="0" to="1" dur="1.5s" begin="0.8s" fill="freeze"/>
  </text>

  <!-- Left contact -->
  <text x="150" y="180" font-family="Verdana, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">github.com/Esraa-Shalaby</text>

  <!-- Right contact -->
  <text x="1050" y="180" font-family="Verdana, sans-serif" font-size="14" fill="#FFFFFF" text-anchor="middle">esraashalaby686@gmail.com</text>
</svg>
